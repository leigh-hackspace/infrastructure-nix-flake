[package]
name = "filestore-web"
version = "0.1.0"
edition = "2021"

# Web (wasm) SPA for filestore.  Built with `./build.sh` into dist/ (not
# committed; the flake builds it — see
# machines/services1/services/filestore.nix) and embedded into the
# filestore binary by build.rs.
[lib]
name = "filestore_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
gloo-timers = "0.3"
# Pinned exactly: the wasm-bindgen *crate* must match the wasm-bindgen-cli
# (0.2.128, installed by the devshell) byte-for-byte — the generated glue is
# schema-versioned. js-sys/web-sys pin the matching wasm-bindgen release.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "Event",
    "KeyboardEvent",
    "EventTarget",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
    "DataTransfer",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
