<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frigate-monitor · main_space</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0f1216; color: #dbe1e8; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 18px; background: #171c23; border-bottom: 1px solid #242c36;
    flex: 0 0 auto;
  }
  header h1 { font-size: 16px; margin: 0; }
  .statusline { color: #8ea0b3; font-size: 12.5px; }
  .live { height: 52px; width: auto; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; border: 1px solid #242c36; background: #000; margin-left: auto; }

  .scroller { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 18px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }

  .card {
    appearance: none; cursor: pointer; text-align: left;
    background: #171c23; border: 1px solid #242c36; border-radius: 10px;
    padding: 0; overflow: hidden; transition: border-color .15s, transform .1s;
    width: 100%;
  }
  .card:hover { border-color: #3f83c8; }
  .card:active { transform: translateY(1px); }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }

  /* Before/after crossfade on hover (see HoverReveal).
     The resting layer sits in flow; the hover layer is overlaid and fades in. */
  .hover-reveal { position: relative; display: block; }
  .hover-reveal img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
  .hover-reveal .hr-hover {
    position: absolute; inset: 0; z-index: 2; opacity: 0;
    transition: opacity .25s ease-in-out;
  }
  .hover-reveal:hover .hr-hover { opacity: 1; }
  .cardmeta { padding: 7px 11px; color: #93a3b5; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }

  .empty { color: #6f7f90; padding: 60px 20px; text-align: center; white-space: pre-line; }
  .loadstatus { text-align: center; color: #5f7285; padding: 14px; font-size: 13px; }

  /* Popup: fixed overlay over the still-mounted grid (scroll position is
     preserved underneath). */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(5, 7, 10, 0.72);
    overflow-y: auto; padding: 26px 16px;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .popup {
    background: #141920; border: 1px solid #2a3340; border-radius: 12px;
    max-width: 1280px; width: 100%; padding: 16px 18px 20px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
  }
  .popuphead { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .popuptitle { font-size: 15px; font-weight: 600; }
  .popupsub { color: #8a99aa; font-size: 12.5px; margin-top: 2px; }
  .closebtn {
    appearance: none; background: #1d242e; color: #aab6c4; border: 1px solid #2f3947;
    border-radius: 8px; width: 34px; height: 34px; font-size: 15px; cursor: pointer; flex: 0 0 auto;
  }
  .closebtn:hover { color: #fff; border-color: #5a6a7e; }

  .subhead { color: #7f8fa0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 8px; }
  .pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .pairs figure { margin: 0; }
  .pairs figcaption { color: #7f8fa0; font-size: 12px; margin-bottom: 5px; }
  .pairs img { width: 100%; display: block; border-radius: 8px; border: 1px solid #242c36; background: #000; }
  .zoompairs { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

  @media (max-width: 640px) {
    .pairs { grid-template-columns: 1fr; }
    .live { display: none; }
  }
</style>
</head>
<body>
  <div id="main"></div>
  <script type="module">
    import init from './frigate_monitor_web.js';
    await init();
  </script>
</body>
</html>
