[package]
name = "frigate-monitor-web"
version = "0.1.0"
edition = "2021"

# Web (wasm) SPA for frigate-monitor. Built with `./build.sh` into dist/,
# which is committed and embedded into the frigate-monitor binary by its
# build.rs (Nix builds never compile this — same rule as network-status).
[lib]
name = "frigate_monitor_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
gloo-net = "0.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
