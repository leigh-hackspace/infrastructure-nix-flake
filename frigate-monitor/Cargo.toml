[package]
name = "frigate-monitor"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "frigate-monitor"
path = "src/main.rs"

# House style is zero external crates, but image decoding/encoding in pure
# stdlib is not sensible — the `image` crate (JPEG only) is the one
# exception.  The computer-vision analysis (background model, shadow
# suppression, motion gating, settle tracking) is purpose-built in
# src/detect.rs; no OpenCV-style binding is worth the deployment cost here.
[dependencies]
image = "0.25"
