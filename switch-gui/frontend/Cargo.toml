[package]
name = "switch-gui-web"
version = "0.1.0"
edition = "2021"

# Web (wasm) SPA for switch-gui.  Built with `./build.sh` into dist/
# (git-ignored), embedded into the switch-gui binary by its build.rs — the flake
# compiles it from source (machines/services1/services/switch-gui.nix).
#
# The dependency set is deliberately the same one gocardless-dashboard/frontend
# already resolves: the versions in Cargo.lock are the ones the offline wasm
# build in `nix develop` can reach from the cargo cache, and dioxus must stay at
# the version common/crane.nix pins the wasm-bindgen CLI against.
[lib]
name = "switch_gui_web"
crate-type = ["cdylib", "rlib"]

# Standalone crate (wasm toolchain, own lockfile) — opt out of the native
# workspace in the parent directory.
[workspace]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
# Only to serialise an intent into a request body; the responses come back
# through gloo-net's own serde support.
serde_json = "1"
# Shared API types (the same definitions the server serves and decodes).
# In the source tree dto/ is a symlink to ../dto (git-ignored); the Nix build
# replaces it with a real copy (see switch-gui.nix).
switch-gui-dto = { path = "./dto" }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
# Window/Location/History drive the browser back/forward buttons (the SPA maps
# /switch/<name> <-> the page and listens for popstate); HtmlSelectElement is
# what the untagged-VLAN dropdown reads.
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "History",
  "EventTarget",
  "Event",
  "HtmlSelectElement",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
