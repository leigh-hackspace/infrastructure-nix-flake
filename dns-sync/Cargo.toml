[package]
name = "dns-sync"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dns-sync"
path = "src/main.rs"

[dependencies]
# Shared hand-rolled JSON parser (the same one moonraker-exporter uses).
# In the source tree common-rs/ is a symlink to ../common-rs (git-ignored); the
# Nix build replaces it with a real copy (see common/crane.nix).
common-json = { path = "./common-rs/json" }
