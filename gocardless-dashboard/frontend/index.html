<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gocardless-dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0f1216; color: #dbe1e8; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px; background: #171c23; border-bottom: 1px solid #242c36;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; }
  .statusline { color: #8ea0b3; font-size: 12.5px; }
  .statusline .err { color: #e07a7a; }
  .spacer { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .user { color: #8ea0b3; font-size: 13px; }

  button.action {
    appearance: none; background: #1d242e; color: #aab6c4; border: 1px solid #2f3947;
    border-radius: 8px; padding: 6px 14px; cursor: pointer;
  }
  button.action:hover { color: #fff; border-color: #5a6a7e; }
  button.action.primary { background: #25527e; border-color: #2f6699; color: #fff; }
  button.action.primary:hover { background: #2c619a; }
  button.action:disabled { opacity: .5; cursor: default; }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; padding: 16px 18px 0; }
  .stat {
    background: #171c23; border: 1px solid #242c36; border-radius: 10px;
    padding: 10px 16px; min-width: 130px;
  }
  .stat .label { color: #7f8fa0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; }
  .stat .value { font-size: 20px; font-weight: 650; margin-top: 2px; }
  .stat .value.ok { color: #6fcf97; }
  .stat .value.warn { color: #e0b45a; }

  .filters { display: flex; gap: 8px; align-items: center; padding: 14px 18px 10px; flex-wrap: wrap; }
  .filters button {
    appearance: none; background: #1d242e; border: 1px solid #2f3947; color: #93a3b5;
    border-radius: 8px; padding: 5px 14px; cursor: pointer;
  }
  .filters button.on { background: #25527e; border-color: #2f6699; color: #fff; }
  .search {
    background: #12161c; border: 1px solid #2f3947; color: #dbe1e8; border-radius: 8px;
    padding: 6px 12px; font: inherit; min-width: 280px;
  }
  .search:focus { outline: none; border-color: #5a6a7e; }
  .search::placeholder { color: #5f6f80; }
  .count { color: #7f8fa0; font-size: 12.5px; margin-left: 4px; }
  th.sort { cursor: pointer; user-select: none; }
  th.sort:hover { color: #c3cedb; }

  .id { color: #8a97a8; font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .01em; }
  .hint { color: #e0b45a; margin-top: 3px; }
  .note {
    background: #241f14; border: 1px solid #4a3d1e; color: #d9c08a;
    border-radius: 8px; padding: 10px 14px; margin: 6px 0 4px;
    font-size: 13px; line-height: 1.55;
  }
  .note b { color: #e0b45a; font-weight: 650; }

  .scroller { flex: 1 1 auto; overflow-x: auto; padding: 14px 18px 26px; }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1e2530; white-space: nowrap; }
  th { color: #7f8fa0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #151b23; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .pill.active { background: #16351f; color: #6fcf97; border: 1px solid #2b5c3c; }
  .pill.stale { background: #3a2c14; color: #e0b45a; border: 1px solid #6b5423; }
  .pill.ok { background: #16351f; color: #6fcf97; }
  .pill.bad { background: #3a1a1a; color: #e07a7a; }
  .pill.mute { background: #1d242e; color: #93a3b5; }

  .sub { color: #7f8fa0; font-size: 12px; }
  td.wrap { white-space: normal; max-width: 460px; }
  .empty { color: #6f7f90; padding: 50px 20px; text-align: center; }

  .back { color: #7f95ad; cursor: pointer; font-size: 13px; }
  .back:hover { color: #fff; }
  .detailhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .detailhead h2 { margin: 0; font-size: 18px; }
  .subhead { color: #7f8fa0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 20px 0 8px; }
  .errline { color: #e07a7a; padding: 10px 18px; }
</style>
</head>
<body>
  <div id="main"></div>
  <script type="module">
    import init from './gocardless_dashboard_web.js';
    await init();
  </script>
</body>
</html>
