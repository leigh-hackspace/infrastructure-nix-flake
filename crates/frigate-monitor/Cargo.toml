[package]
name = "frigate-monitor"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "frigate-monitor"
path = "src/main.rs"

# House style is zero external crates, but image decoding/encoding in pure
# stdlib is not sensible — the `image` crate (JPEG only) is the one
# exception.  The computer-vision analysis (background model, shadow
# suppression, motion gating, settle tracking) is purpose-built in
# src/detect.rs; no OpenCV-style binding is worth the deployment cost here.
[dependencies]
image = "0.25"

# Shared in-tree JSON emitter (`quoted`), used by the API's hand-built bodies.
# An in-tree crate is not an external dependency: see crates/common-rs/.
common-json = { path = "../common-rs/json" }

# Shared build.rs helper that embeds the SPA bundle (common-rs/build-spa).
[build-dependencies]
common-build-spa = { path = "../common-rs/build-spa" }
