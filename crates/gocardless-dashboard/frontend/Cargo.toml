[package]
name = "gocardless-dashboard-web"
version = "0.1.0"
edition = "2021"

# Web (wasm) SPA for gocardless-dashboard. Built with `./build.sh` into
# dist/ (git-ignored), embedded into the gocardless-dashboard binary by its
# build.rs (Nix builds compile it from source; see
# machines/services1/services/gocardless-dashboard.nix).
[lib]
name = "gocardless_dashboard_web"
crate-type = ["cdylib", "rlib"]

# This SPA is its own cargo workspace, deliberately: it is built for
# wasm32-unknown-unknown against a wasm-bindgen pinned to match the CLI the flake
# uses, and it must not share the native workspace's lock file (one graph would
# unify host and wasm deps and move wasm-bindgen out from under that CLI).  The
# reason is written out in crates/Cargo.toml; the empty table below is what keeps
# cargo from adopting this directory into the native workspace.
[workspace]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
# Shared API types (same definitions the backend decodes into / serves).
# In the source tree dto/ is a symlink to ../dto (git-ignored); the Nix
# build replaces it with a real copy (see gocardless-dashboard.nix).
gdash-dto = { path = "./dto" }
gloo-net = "0.6"
gloo-timers = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
# History + EventTarget/Event drive the browser back/forward button (the SPA
# maps /customers/<id> <-> the detail view and listens for popstate).
web-sys = { version = "0.3", features = ["Window", "Location", "History", "EventTarget", "Event"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
