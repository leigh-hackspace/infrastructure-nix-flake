[package]
name = "filestore-web"
version = "0.1.0"
edition = "2021"

# Web (wasm) SPA for filestore.  Built with `./build.sh` into dist/ (not
# committed; the flake builds it — see
# machines/services1/services/filestore.nix) and embedded into the
# filestore binary by build.rs.
[lib]
name = "filestore_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
gloo-timers = "0.3"
# Shared preview table, so the UI and the API cannot disagree about what is
# previewable (see common-rs/preview and filestore/tests/README.md bug #6).
common-preview = { path = "./common-rs/preview" }
# Pinned exactly: the wasm-bindgen *crate* must match the wasm-bindgen-cli
# (0.2.128, installed by the devshell) byte-for-byte — the generated glue is
# schema-versioned. js-sys/web-sys pin the matching wasm-bindgen release.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "DragEvent",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
    "DataTransfer",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# This SPA is its own cargo workspace, deliberately: it is built for
# wasm32-unknown-unknown against a wasm-bindgen pinned to match the CLI the flake
# uses, and it must not share the native workspace's lock file (one graph would
# unify host and wasm deps and move wasm-bindgen out from under that CLI).  The
# reason is written out in crates/Cargo.toml; the empty table below is what keeps
# cargo from adopting this directory into the native workspace.
[workspace]
