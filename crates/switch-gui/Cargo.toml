[package]
name = "switch-gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "switch-gui"
path = "src/main.rs"

# switch-gui: manages the network's ProCurve switches from a browser.
#
# It used to be a zero-dependency tool — Telnet client, CLI parsers, HTTP server
# and HTML all hand-written, on the argument that a tool for debugging a network
# must not resolve DNS or need a crate to read a switch.  That is still true of
# the parts that talk to the switches (`telnet.rs`, `parse.rs`, `commands.rs`,
# `switch.rs`: no crates, and the HTTP server is still the in-tree one on
# `common-rs/web`).
#
# What changed is where the page's data comes from.  Reading three switches over
# Telnet takes seconds, so the GUI now reads a **shadow copy in Postgres** that a
# background sync keeps in step, and writes go through a **queue** in the same
# database (which is also the audit trail).  That needs a connection pool, a
# query builder and a JSON layer, which is the house stack for exactly this
# (gocardless-dashboard): sqlx + sea-query, with the shared plumbing in
# `common-rs/pg`.  `common-rs/oidc` replaces this crate's hand-written PKCE login
# for the same reason `common-rs/web` replaced its response writer: the contract
# is documented in one place now, and authentik bites anyone who re-implements it
# (see docs/authentik-oidc-notes.md).
#
# Still no crates, on purpose: the Telnet client and the CLI parsers.  They are
# the reason this tool exists, and a dependency that buffers a line the way the
# 2824 does not page its output would put the switches back behind a wall.
[dependencies]
switch-gui-dto = { path = "dto" }
# Shared in-tree crates (see common/crane.nix and the `sharedCrates` list in
# machines/services1/services/switch-gui.nix):
#   json    — the parser behind the `show` table readers, and the JSON emitter the
#             jsonb columns are built with
#   web     — request/response plumbing, query + cookie helpers
#   oidc    — authentik login with S256 PKCE, `Infra` group gate
#   pg      — the pool, the schema runner, the sea-query→sqlx glue, row readers
#   service — the env file, the bind-address test that gates the escape hatches
common-json = { path = "../common-rs/json" }
common-web = { path = "../common-rs/web" }
common-oidc = { path = "../common-rs/oidc" }
common-pg = { path = "../common-rs/pg" }
common-service = { path = "../common-rs/service" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
# Only for the OIDC token/introspect calls that common-oidc makes.  rustls, not
# native-tls: the unit has no CA bundle of its own to point at.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
sea-query = { version = "0.32", default-features = false, features = [
  "backend-postgres",
] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared build.rs helper that embeds the SPA bundle (common-rs/build-spa).
[build-dependencies]
common-build-spa = { path = "../common-rs/build-spa" }
