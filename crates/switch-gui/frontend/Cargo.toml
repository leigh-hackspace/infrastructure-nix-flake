[package]
name = "switch-gui-web"
version = "0.1.0"
edition = "2021"

# Web (wasm) SPA for switch-gui.  Built with `./build.sh` into dist/
# (git-ignored), embedded into the switch-gui binary by its build.rs — the flake
# compiles it from source (machines/services1/services/switch-gui.nix).
#
# The dependency set is deliberately the same one gocardless-dashboard/frontend
# already resolves: the versions in Cargo.lock are the ones the offline wasm
# build in `nix develop` can reach from the cargo cache, and dioxus must stay at
# the version common/crane.nix pins the wasm-bindgen CLI against.
[lib]
name = "switch_gui_web"
crate-type = ["cdylib", "rlib"]

# This SPA is its own cargo workspace, deliberately: it is built for
# wasm32-unknown-unknown against a wasm-bindgen pinned to match the CLI the flake
# uses, and it must not share the native workspace's lock file (one graph would
# unify host and wasm deps and move wasm-bindgen out from under that CLI).  The
# reason is written out in crates/Cargo.toml; the empty table below is what keeps
# cargo from adopting this directory into the native workspace.
[workspace]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
# Only to serialise an intent into a request body; the responses come back
# through gloo-net's own serde support.
serde_json = "1"
# Shared API types (the same definitions the server serves and decodes).
# In the source tree dto/ is a symlink to ../dto (git-ignored); the Nix build
# replaces it with a real copy (see switch-gui.nix).
switch-gui-dto = { path = "./dto" }
# The component library — a pruned vendored copy of dioxus-components' `primitives`
# (docs/component-library.md). Reached the same way as dto/: symlink here, real copy
# in the Nix build (`sharedCrates`).  The widgets are upstream's, not ours.
common-ui = { path = "./common-rs/ui" }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
# Window/Location/History drive the browser back/forward buttons (the SPA maps
# /switch/<name> <-> the page and listens for popstate); HtmlSelectElement is
# what the untagged-VLAN dropdown reads.
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "History",
  "EventTarget",
  "Event",
  "HtmlSelectElement",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
